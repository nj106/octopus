# Octopus deployment for Portainer (nj106 fork).
# - bridge network mode (no dedicated project network)
# - host port 8085 -> container 8080
# Named volume instead of the upstream '/path/to/data' placeholder.
# No required env vars; default login admin/admin (change after first login).
services:
  octopus:
    image: bestrui/octopus
    container_name: octopus
    network_mode: bridge
    restart: unless-stopped
    ports:
      - "8085:8080"
    volumes:
      - octopus-data:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  octopus-data:
    name: octopus_data
    driver: local
